name: refresh-data
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC
    - cron: "47 * * * *"   # and :47 — GitHub often skips scheduled runs, so two slots keep the hourly cadence
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}   # optional; AIS sampling is skipped when empty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests openpyxl
      - name: AIS dependency (only when the AISSTREAM_KEY secret exists)
        if: ${{ env.AISSTREAM_KEY != '' }}
        run: pip install -q websockets
      - name: Fetch free sources (each fails independently)
        run: python fetch.py
      - name: Risk map feeds (UKMTO incidents, JWLA and JMIC checks)
        run: python scripts/risk_refresh.py
      - name: Commit only when data changed
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data fleets.json
          # status.json and history.json change every run; commit only if a real data file changed
          okchg=$(python - <<'PY'
          import json, subprocess
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/status.json"]))
          except Exception:
              old = {"sources": {}}
          new = json.load(open("data/status.json"))
          f = lambda d: {k: v.get("ok") for k, v in d.get("sources", {}).items()}
          print("yes" if f(old) != f(new) else "no")
          PY
          )
          if [ "$okchg" = "yes" ] || git diff --cached --name-only | grep -v -E '^data/(status|history|derived)\.json$' | grep -q .; then
            git commit -m "data $(date -u +%FT%TZ)"
            git push || { git pull --rebase -X theirs -q && git push; }
          else
            echo "No source data changed; nothing committed."
          fi
